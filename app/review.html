<!doctype html>
<html lang="en">
<head>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Reviewer sign-in · BAPHY105 Notes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,500&display=swap">
<link rel="stylesheet" href="css/app.css">
<style>
  body { overflow-y: auto; }
  .rv label { display: block; margin: 0 0 12px; font-size: 14.5px; color: var(--text-2); }
  .rv input { display: block; width: 100%; box-sizing: border-box; margin-top: 6px; }
</style>
</head>
<body>
<div class="gate">
  <div class="gate-card">
    <div class="gate-eyebrow">BAPHY105 · Engineering Physics</div>
    <h1 class="gate-title">Reviewer sign-in</h1>
    <p class="gate-lead">For payment-gateway website reviewers. Students sign in with their VIT Google account on the <a href="./" style="color:inherit">main page</a> instead.</p>
    <form id="rv" class="rv">
      <label>Username<input id="ru" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="60" value="review@baphy105" required></label>
      <label>Access code<input id="rc" type="password" autocomplete="current-password" maxlength="200" required></label>
      <button class="btn primary" type="submit">Sign in</button>
    </form>
    <p class="gate-msg" id="rm" role="alert"></p>
    <p class="gate-muted gate-small">The reviewer account can open the free modules, the payment page and the UPI checkout.</p>
    <p class="gate-muted gate-small gate-legal"><a href="terms.html" style="color:inherit">Terms</a> · <a href="refund.html" style="color:inherit">Refunds</a> · <a href="contact.html" style="color:inherit">Contact</a> · <a href="privacy.html" style="color:inherit">Privacy</a></p>
  </div>
</div>
<script>
(function () {
  'use strict';
  const m = document.getElementById('rm');
  document.getElementById('rv').addEventListener('submit', async (e) => {
    e.preventDefault(); m.textContent = 'Signing in…';
    try {
      const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'same-origin', body: JSON.stringify({ reviewUser: document.getElementById('ru').value, reviewCode: document.getElementById('rc').value }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) { m.textContent = j.error || 'Sign-in failed (' + r.status + ').'; return; }
      location.href = './';
    } catch (err) { m.textContent = 'Could not reach the site. Check your connection.'; }
  });
})();
</script>
</body>
</html>
